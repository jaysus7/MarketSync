<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketSync Academy</title>
<meta name="robots" content="noindex">
<!--
  The Academy is its OWN place, not a page in the dashboard.

  Learning is a different mode from working: you are not triaging a queue, you are
  reading something end to end. Wrapping that in the dashboard shell — department
  sidebar, My Day, notification bell — puts the whole store's unfinished work in your
  peripheral vision while you are trying to concentrate. So this is a separate document
  with its own navigation and nothing else on the screen.

  It shares the app's session (the same `token` in localStorage) and talks to the same
  API. It is not public: without a session it says so and sends you to sign in.

  Content lives in the database (staff_training_lessons), authored in
  marketplace-backend/academy-lessons.js and pushed by scripts/academy-sync.mjs. Nothing
  on this page is hard-coded course text — if a course has no lessons, this page says the
  course cannot be taken yet rather than opening an empty reader.
-->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
  // Match the dashboard's theme choice so moving between them is not a flash of white.
  try { if (localStorage.getItem('theme') === 'dark' ||
        (!localStorage.getItem('theme') && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<style>
  .prose-lesson p { margin-bottom: 0.9rem; line-height: 1.7; }
  .prose-lesson p:last-child { margin-bottom: 0; }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased min-h-screen">

<header class="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-200 dark:border-slate-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center gap-4">
    <a href="/dashboard.html" class="flex items-center gap-2 shrink-0" title="Back to MarketSync">
      <span class="w-1.5 h-6 bg-violet-500 rounded-sm"></span>
      <span class="text-lg font-black tracking-tight text-slate-900 dark:text-white">Market<span class="text-violet-600 dark:text-violet-400">Sync</span></span>
      <span class="text-lg font-black tracking-tight text-slate-400">Academy</span>
    </a>
    <div class="flex-1"></div>
    <input id="ac-search" type="search" placeholder="Search courses…" oninput="acRender()"
      class="hidden sm:block w-56 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-sm">
    <a href="/dashboard.html" class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Back to MarketSync</a>
  </div>
</header>

<main id="ac-main" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="text-sm text-slate-400 py-20 text-center">Loading the Academy…</div>
</main>

<script>
const API = (location.hostname.includes('staging')
  ? 'https://marketsync-staging-backend.onrender.com'
  : 'https://vehicle-marketplace-s0e4.onrender.com');

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const token = () => { try { return localStorage.getItem('token') || ''; } catch (e) { return ''; } };

async function api(path, method = 'GET', body) {
  const res = await fetch(API + path, {
    method,
    headers: { Authorization: 'Bearer ' + token(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch (e) {}
  if (!res.ok) throw new Error(data?.error || `Request failed (${res.status})`);
  return data;
}

// ── State ───────────────────────────────────────────────────────────────────
let CATALOG = null;         // the whole catalogue, or null if it could not be read
let CATALOG_ERROR = null;
let VIEW = { name: 'catalog', dept: 'mine', level: 'all' };
let COURSE = null;          // the open course, with its lessons
let LESSON_INDEX = 0;

const LEVEL_LABEL = { required: 'Required', foundation: 'Foundations', advanced: 'Advanced', reference: 'Reference' };
const LEVEL_TONE = {
  required: 'bg-rose-100 text-rose-700 dark:bg-rose-950/50 dark:text-rose-300',
  foundation: 'bg-sky-100 text-sky-700 dark:bg-sky-950/50 dark:text-sky-300',
  advanced: 'bg-violet-100 text-violet-700 dark:bg-violet-950/50 dark:text-violet-300',
  reference: 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300',
};

// ── Boot ────────────────────────────────────────────────────────────────────
async function acBoot() {
  if (!token()) {
    document.getElementById('ac-main').innerHTML = acNotice('You are not signed in',
      'The Academy needs a MarketSync session.',
      '<a href="/login.html" class="inline-block mt-3 px-4 py-2 rounded-lg bg-violet-600 text-white text-sm font-bold">Sign in</a>');
    return;
  }
  try {
    CATALOG = await api('/academy/catalog');
    // Somebody's own department is the most useful landing view.
    VIEW.dept = CATALOG.curricula?.length ? 'mine' : 'all';
  } catch (e) {
    CATALOG_ERROR = e.message;
  }
  acRoute();
}

// Deep-linkable: /academy.html#course/sales_lead_workflow
function acRoute() {
  const hash = location.hash.replace(/^#/, '');
  if (hash.startsWith('course/')) { acOpenCourse(hash.slice('course/'.length)); return; }
  VIEW.name = 'catalog';
  acRender();
}
window.addEventListener('hashchange', acRoute);

function acNotice(title, body, extra) {
  return `<div class="max-w-xl mx-auto text-center py-20">
    <h1 class="text-xl font-black text-slate-900 dark:text-white">${esc(title)}</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">${esc(body)}</p>${extra || ''}</div>`;
}

// ── The catalogue ───────────────────────────────────────────────────────────
function acRender() {
  const main = document.getElementById('ac-main');
  if (CATALOG_ERROR) {
    main.innerHTML = acNotice('The Academy could not be loaded', CATALOG_ERROR,
      '<button onclick="location.reload()" class="mt-3 px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm font-bold">Try again</button>');
    return;
  }
  if (!CATALOG) return;

  const q = (document.getElementById('ac-search')?.value || '').trim().toLowerCase();
  const all = CATALOG.courses || [];

  let courses = all;
  if (VIEW.dept === 'mine') courses = all.filter(c => c.mine);
  else if (VIEW.dept !== 'all') courses = all.filter(c => c.department === VIEW.dept);
  if (VIEW.level !== 'all') courses = courses.filter(c => c.level === VIEW.level);
  if (q) courses = courses.filter(c =>
    (c.title || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q));

  const mine = all.filter(c => c.mine);
  const required = mine.filter(c => c.level === 'required');
  const requiredDone = required.filter(c => c.percent >= 100).length;

  // Departments a person can browse. Every one is shown — seeing that Service has a track
  // is useful even if you are in Sales — but yours is marked.
  const deptBtn = (id, label, count) => {
    const on = VIEW.dept === id;
    return `<button onclick="acDept('${esc(id)}')" class="w-full text-left px-3 py-2 rounded-lg text-[13px] font-bold flex items-center justify-between gap-2 transition ${on
      ? 'bg-violet-600 text-white'
      : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
      <span>${esc(label)}</span><span class="text-[11px] ${on ? 'text-white/70' : 'text-slate-400'}">${count}</span></button>`;
  };

  const levelBtn = (id, label) => {
    const on = VIEW.level === id;
    return `<button onclick="acLevel('${esc(id)}')" class="px-3 py-1.5 rounded-lg text-[13px] font-bold transition ${on
      ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900'
      : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800'}">${esc(label)}</button>`;
  };

  // Within a view, courses group by level and stay in curriculum order — Required first,
  // because that is the order somebody should actually take them in.
  const order = ['required', 'foundation', 'advanced', 'reference'];
  const groups = order
    .map(level => [level, courses.filter(c => c.level === level)])
    .filter(([, list]) => list.length);

  document.getElementById('ac-main').innerHTML = `
    <div class="mb-6">
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">MarketSync Academy</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">Everything the product can teach you, in the order it is worth learning.</p>
    </div>

    ${!CATALOG.has_employment_record ? `<div class="mb-5 rounded-xl border border-amber-300/70 dark:border-amber-700/60 bg-amber-50 dark:bg-amber-950/30 px-4 py-3">
      <div class="text-[13px] font-bold text-amber-900 dark:text-amber-200">Your progress will not be saved.</div>
      <div class="text-[12px] text-amber-700 dark:text-amber-400">No employment record is linked to your account yet, so nothing you complete here can be recorded against you. You can still read every course. Ask whoever manages HR to create your record.</div>
    </div>` : ''}

    ${required.length ? `<div class="mb-6 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div>
          <div class="text-[11px] uppercase tracking-wide text-slate-400 font-bold">Required of you</div>
          <div class="text-lg font-black text-slate-900 dark:text-white">${requiredDone} of ${required.length} complete</div>
        </div>
        ${requiredDone < required.length
          ? `<button onclick="acContinue()" class="px-4 py-2 rounded-xl bg-violet-600 hover:bg-violet-500 text-white text-sm font-bold transition">Continue where you left off</button>`
          : `<span class="text-[13px] font-bold text-emerald-600 dark:text-emerald-400">Everything required of you is done.</span>`}
      </div>
      <div class="mt-3 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
        <div class="h-full bg-violet-500 rounded-full" style="width:${required.length ? Math.round((requiredDone / required.length) * 100) : 0}%"></div>
      </div>
    </div>` : ''}

    <div class="grid grid-cols-1 lg:grid-cols-[220px_minmax(0,1fr)] gap-6 items-start">
      <aside class="space-y-1 lg:sticky lg:top-20">
        <div class="text-[11px] uppercase tracking-wide text-slate-400 font-bold px-3 pb-1">Departments</div>
        ${deptBtn('mine', CATALOG.department ? `${CATALOG.department} — yours` : 'Yours', mine.length)}
        ${deptBtn('all', 'Everything', all.length)}
        <div class="my-2 border-t border-slate-200 dark:border-slate-800"></div>
        ${(CATALOG.departments || []).map(d => deptBtn(d, d, all.filter(c => c.department === d).length)).join('')}
      </aside>

      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-1.5 mb-4">
          ${levelBtn('all', 'All levels')}
          ${order.filter(l => all.some(c => c.level === l)).map(l => levelBtn(l, LEVEL_LABEL[l])).join('')}
        </div>

        ${groups.length ? groups.map(([level, list]) => `
          <section class="mb-7">
            <h2 class="text-[15px] font-black text-slate-900 dark:text-white">${esc(LEVEL_LABEL[level] || level)}</h2>
            <p class="text-[12px] text-slate-400 mb-3">${esc(acLevelBlurb(level))}</p>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
              ${list.map(acCourseCard).join('')}
            </div>
          </section>`).join('')
        : `<div class="text-sm text-slate-400 py-16 text-center">No courses match that.</div>`}
      </div>
    </div>`;
}

function acLevelBlurb(level) {
  return {
    required: 'Assigned to you automatically. These gate your certifications.',
    foundation: 'What competent operation of the department actually needs.',
    advanced: 'The deeper capabilities. Offered, never forced.',
    reference: 'Searchable material. Nothing here is pushed at you.',
  }[level] || '';
}

function acCourseCard(c) {
  const pct = c.percent || 0;
  const overdue = c.due_at && !c.completed_at && new Date(c.due_at) < new Date();
  return `<button onclick="acGo('${esc(c.course_key)}')" class="text-left bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 hover:border-violet-400 dark:hover:border-violet-700 transition flex flex-col">
    <div class="flex items-center gap-2 mb-2">
      <span class="text-[10px] font-black uppercase tracking-wide px-2 py-0.5 rounded-full ${LEVEL_TONE[c.level] || LEVEL_TONE.reference}">${esc(LEVEL_LABEL[c.level] || c.level)}</span>
      ${c.department ? `<span class="text-[11px] font-bold text-slate-400">${esc(c.department)}</span>` : '<span class="text-[11px] font-bold text-slate-400">Everyone</span>'}
      ${c.mine ? '<span class="text-[10px] font-black text-violet-600 dark:text-violet-400 ml-auto">YOURS</span>' : ''}
    </div>
    <div class="font-black text-[15px] text-slate-900 dark:text-white leading-snug">${esc(c.title)}</div>
    <div class="text-[12px] text-slate-500 dark:text-slate-400 mt-1 flex-1">${esc(c.description || '')}</div>
    <div class="text-[12px] text-slate-400 mt-3">
      ${c.takeable ? `${c.lesson_count} lesson${c.lesson_count === 1 ? '' : 's'} · ${c.minutes} min` : '<span class="text-amber-600 dark:text-amber-400">No lessons yet — this course cannot be taken</span>'}
      ${overdue ? ' · <span class="text-rose-500 font-bold">overdue</span>' : c.due_at && !c.completed_at ? ` · due ${esc(new Date(c.due_at).toLocaleDateString())}` : ''}
    </div>
    ${c.takeable ? `<div class="mt-2 h-1.5 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
      <div class="h-full ${pct >= 100 ? 'bg-emerald-500' : 'bg-violet-500'} rounded-full" style="width:${pct}%"></div>
    </div>
    <div class="text-[11px] mt-1 font-bold ${pct >= 100 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">${pct >= 100 ? 'Complete' : pct > 0 ? `${pct}% · ${c.lessons_done}/${c.lesson_count}` : 'Not started'}</div>` : ''}
  </button>`;
}

function acDept(d) { VIEW.dept = d; acRender(); }
function acLevel(l) { VIEW.level = l; acRender(); }
function acGo(key) { location.hash = 'course/' + key; }

// "Continue" opens the first required course that is not finished — the honest next thing.
function acContinue() {
  const next = (CATALOG.courses || [])
    .filter(c => c.mine && c.level === 'required' && c.takeable && (c.percent || 0) < 100)
    .sort((a, b) => (a.sort || 0) - (b.sort || 0))[0];
  if (next) acGo(next.course_key);
}

// ── One course, its lessons in order ────────────────────────────────────────
async function acOpenCourse(key) {
  const main = document.getElementById('ac-main');
  main.innerHTML = `<div class="text-sm text-slate-400 py-20 text-center">Loading the course…</div>`;
  try {
    COURSE = await api('/academy/courses/' + encodeURIComponent(key));
  } catch (e) {
    main.innerHTML = acNotice('That course could not be opened', e.message,
      '<a href="#" onclick="location.hash=\'\'" class="inline-block mt-3 px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm font-bold">Back to the catalogue</a>');
    return;
  }
  // Open at the first unfinished lesson rather than always at the top.
  const nextId = COURSE.next_lesson_id;
  LESSON_INDEX = Math.max(0, COURSE.lessons.findIndex(l => l.id === nextId));
  if (LESSON_INDEX < 0) LESSON_INDEX = 0;
  acRenderCourse();
}

function acRenderCourse() {
  const c = COURSE.course, lessons = COURSE.lessons || [];
  const main = document.getElementById('ac-main');

  if (!lessons.length) {
    main.innerHTML = acNotice(c.title,
      'This course has no lessons yet, so there is nothing to take. It has not been written rather than hidden from you.',
      '<a href="#" onclick="location.hash=\'\'" class="inline-block mt-3 px-4 py-2 rounded-lg border border-slate-200 dark:border-slate-700 text-sm font-bold">Back to the catalogue</a>');
    return;
  }

  const lesson = lessons[LESSON_INDEX];
  const done = lessons.filter(l => l.completed).length;
  const pct = Math.round((done / lessons.length) * 100);

  const nav = lessons.map((l, i) => {
    const on = i === LESSON_INDEX;
    return `<button onclick="acLesson(${i})" class="w-full text-left px-3 py-2.5 rounded-lg flex items-start gap-2.5 transition ${on
      ? 'bg-violet-50 dark:bg-violet-950/40 border border-violet-300 dark:border-violet-800'
      : 'hover:bg-slate-100 dark:hover:bg-slate-800 border border-transparent'}">
      <span class="mt-0.5 shrink-0 w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-black ${l.completed
        ? 'bg-emerald-500 text-white'
        : on ? 'bg-violet-600 text-white' : 'bg-slate-200 dark:bg-slate-700 text-slate-500'}">${l.completed ? '✓' : i + 1}</span>
      <span class="min-w-0 flex-1">
        <span class="block text-[13px] font-bold ${on ? 'text-violet-700 dark:text-violet-300' : 'text-slate-700 dark:text-slate-200'}">${esc(l.title)}</span>
        <span class="block text-[11px] text-slate-400">${l.kind === 'checkpoint' ? 'Checkpoint · ' : ''}${l.estimated_minutes} min</span>
      </span>
    </button>`;
  }).join('');

  const bodyHtml = String(lesson.body || '').split(/\n\n+/).map(p => `<p>${esc(p)}</p>`).join('');

  main.innerHTML = `
    <button onclick="location.hash=''" class="text-[13px] font-bold text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 mb-4">&larr; All courses</button>

    <div class="mb-5">
      <div class="flex items-center gap-2 mb-1">
        <span class="text-[10px] font-black uppercase tracking-wide px-2 py-0.5 rounded-full ${LEVEL_TONE[c.level] || LEVEL_TONE.reference}">${esc(LEVEL_LABEL[c.level] || c.level)}</span>
        <span class="text-[11px] font-bold text-slate-400">${esc(c.department || 'Everyone')}</span>
      </div>
      <h1 class="text-2xl font-black text-slate-900 dark:text-white">${esc(c.title)}</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400">${esc(c.description || '')}</p>
      <div class="mt-3 flex items-center gap-3">
        <div class="flex-1 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden max-w-xs">
          <div class="h-full ${pct >= 100 ? 'bg-emerald-500' : 'bg-violet-500'} rounded-full" style="width:${pct}%"></div>
        </div>
        <span class="text-[12px] font-bold ${pct >= 100 ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-400'}">${done}/${lessons.length} lessons</span>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-[280px_minmax(0,1fr)] gap-6 items-start">
      <aside class="space-y-1 lg:sticky lg:top-20 lg:max-h-[75vh] lg:overflow-y-auto">
        <div class="text-[11px] uppercase tracking-wide text-slate-400 font-bold px-3 pb-1">Lessons</div>
        ${nav}
      </aside>

      <article class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 sm:p-8 min-w-0">
        ${lesson.kind === 'checkpoint' ? `<div class="inline-flex items-center gap-1.5 text-[11px] font-black uppercase tracking-wide text-violet-600 dark:text-violet-400 mb-2">Checkpoint — do this in MarketSync</div>` : ''}
        <h2 class="text-xl font-black text-slate-900 dark:text-white">${esc(lesson.title)}</h2>
        ${lesson.summary ? `<p class="text-[13px] text-slate-500 dark:text-slate-400 mt-1">${esc(lesson.summary)}</p>` : ''}
        <div class="prose-lesson text-[15px] text-slate-700 dark:text-slate-200 mt-5">${bodyHtml}</div>

        <div class="flex flex-wrap items-center gap-2 mt-8 pt-5 border-t border-slate-100 dark:border-slate-800">
          <button onclick="acPrev()" ${LESSON_INDEX === 0 ? 'disabled' : ''}
            class="px-3 py-2 rounded-lg text-sm font-bold border border-slate-200 dark:border-slate-700 ${LESSON_INDEX === 0 ? 'opacity-40 cursor-not-allowed' : 'hover:bg-slate-100 dark:hover:bg-slate-800'} transition">Previous</button>
          ${lesson.completed
            ? `<span class="text-[13px] font-bold text-emerald-600 dark:text-emerald-400">Completed</span>`
            : `<button onclick="acComplete('${esc(lesson.id)}')" class="px-4 py-2 rounded-lg bg-violet-600 hover:bg-violet-500 text-white text-sm font-bold transition">${lesson.kind === 'checkpoint' ? 'I have done this' : 'Mark as read'}</button>`}
          ${LESSON_INDEX < lessons.length - 1
            ? `<button onclick="acNext()" class="px-3 py-2 rounded-lg text-sm font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Next lesson</button>`
            : ''}
          <span id="ac-msg" class="text-[12px] text-slate-400"></span>
        </div>
      </article>
    </div>`;
}

function acLesson(i) { LESSON_INDEX = i; acRenderCourse(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function acPrev() { if (LESSON_INDEX > 0) acLesson(LESSON_INDEX - 1); }
function acNext() { if (LESSON_INDEX < (COURSE.lessons || []).length - 1) acLesson(LESSON_INDEX + 1); }

// Completion is the server's answer, not an optimistic tick. If the write fails the
// lesson stays unfinished on screen — a checkbox that lies about a compliance record is
// worse than one that refuses.
async function acComplete(lessonId) {
  const msg = document.getElementById('ac-msg');
  if (msg) msg.textContent = 'Saving…';
  try {
    const r = await api('/academy/lessons/' + encodeURIComponent(lessonId) + '/complete', 'POST', {});
    const lesson = (COURSE.lessons || []).find(l => l.id === lessonId);
    if (lesson) lesson.completed = true;
    if (r.warning && msg) msg.textContent = r.warning;
    if (r.course_completed) {
      // Refresh the catalogue so the card and the required-progress bar are right when
      // they go back, rather than showing stale numbers.
      api('/academy/catalog').then(d => { CATALOG = d; }).catch(() => {});
    }
    if (LESSON_INDEX < (COURSE.lessons || []).length - 1) acLesson(LESSON_INDEX + 1);
    else acRenderCourse();
  } catch (e) {
    if (msg) msg.textContent = e.message;
  }
}

acBoot();
</script>
</body>
</html>
