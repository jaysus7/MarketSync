<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- A customer's private video link must never be indexed. -->
  <meta name="robots" content="noindex,nofollow">
  <title>Your video</title>
  <style>
    :root { --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --bg:#f1f5f9; --card:#fff; --brand:#1e3a8a; }
    @media (prefers-color-scheme: dark) {
      :root { --ink:#e2e8f0; --mut:#94a3b8; --line:#1e293b; --bg:#0b0f19; --card:#0f172a; --brand:#1d4ed8; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.06); }
    .head { background:var(--brand); color:#fff; padding:16px 20px; }
    .head h1 { margin:0; font-size:17px; font-weight:800; line-height:1.3; }
    .head p { margin:4px 0 0; font-size:13px; opacity:.85; }
    video { width:100%; display:block; background:#000; }
    .body { padding:18px 20px; }
    .muted { color:var(--mut); font-size:13px; }
    .err { padding:28px 20px; text-align:center; }
    .err h2 { font-size:16px; margin:0 0 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card">
      <div class="body muted" id="loading">Loading your video…</div>
    </div>
    <p class="muted" style="text-align:center;margin-top:14px">Sent to you by your salesperson.</p>
  </div>

<script>
  const API = 'https://vehicle-marketplace-s0e4.onrender.com';
  // This page is served as a plain static file with no /watch.html/:token
  // rewrite, so a real link can only ever be /watch.html?t=TOKEN — the query
  // string is checked first. The path-segment fallback below is dead in
  // production but kept for a future server-side rewrite that would make
  // /watch.html/TOKEN work too, without needing another change here.
  const token = new URLSearchParams(location.search).get('t')
             || location.pathname.split('/').filter(Boolean).slice(1).pop() || '';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  // Every event this page sends requires JavaScript, and `play_started` additionally
  // requires the browser to have begun playback. That is what separates a real viewer from
  // the mail scanners and link previewers that fetch this URL the moment it is delivered —
  // those are recorded server-side as a fetch, and are never counted as a view.
  function send(kind, position) {
    try {
      const body = JSON.stringify({ kind, position_seconds: position });
      // keepalive so a 'progress' ping still lands when the tab is being closed.
      fetch(`${API}/v/${encodeURIComponent(token)}/event`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body, keepalive: true,
      }).catch(() => {});
    } catch (e) {}
  }

  function fail(msg) {
    document.getElementById('card').innerHTML =
      `<div class="err"><h2>${esc(msg)}</h2><p class="muted">If you were expecting a video, reply to the message you received and your salesperson can send a new link.</p></div>`;
  }

  (async () => {
    if (!token) return fail('This link is missing its code.');
    let d;
    try {
      const r = await fetch(`${API}/v/${encodeURIComponent(token)}`);
      d = await r.json();
      if (!r.ok) return fail(d.error || 'This video link is no longer available.');
    } catch (e) { return fail('We could not load this video right now.'); }

    const heading = d.vehicle ? `Your ${esc(d.vehicle)}` : esc(d.title || 'A video for you');
    document.title = heading;
    document.getElementById('card').innerHTML = `
      <div class="head">
        <h1>${heading}</h1>
        ${d.from ? `<p>From ${esc(d.from)}</p>` : ''}
      </div>
      <video id="v" controls playsinline preload="metadata"
             ${d.poster ? `poster="${esc(d.poster)}"` : ''} src="${esc(d.url)}"></video>
      ${d.title && d.vehicle ? `<div class="body"><div class="muted">${esc(d.title)}</div></div>` : ''}`;

    const v = document.getElementById('v');
    let started = false, last = -1;
    v.addEventListener('play', () => { if (!started) { started = true; send('play_started', Math.floor(v.currentTime)); } });
    // One ping per whole second at most, and only when moving forward: a customer who scrubs
    // back has not watched more, and the server takes the furthest point rather than a sum.
    v.addEventListener('timeupdate', () => {
      const t = Math.floor(v.currentTime);
      if (t > last) { last = t; if (t % 5 === 0 && t > 0) send('progress', t); }
    });
    v.addEventListener('ended', () => send('completed', Math.floor(v.duration || last)));
    window.addEventListener('pagehide', () => { if (started && last > 0) send('progress', last); });
  })();
</script>
</body>
</html>
