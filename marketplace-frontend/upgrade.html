  <script>
    const API = 'https://vehicle-marketplace-s0e4.onrender.com';

    // Package copy (features + tagline). Amounts + currency come live from the API.
    const PKG_META = {
      starter: { tagline: 'Core dealership platform to get selling.', popular: false, features: ['Inventory sync + Marketplace posting', 'CRM, leads & task board', 'Deal desk + bill of sale', 'Team + performance dashboards'] },
      growth:  { tagline: 'Adds the AI + intelligence layer.', popular: true, features: ['Everything in Starter', 'AI listings, replies & window stickers', 'Intelligence by MarketSync + AI Vision', 'Pricing insights & market reports'] },
      pro:     { tagline: 'The full operating system.', popular: false, features: ['Everything in Growth', 'Equity mining + executive dashboard', 'Accounting, commissions & forecasting', 'Priority support'] },
    };
    const CHATBOT = { key: 'ai_chatbot', label: 'AI Chatbot only', amount: 499, tagline: 'Just the AI sales chatbot — embed it on your existing site (LeadBox, eDealer, WordPress, anywhere).', features: ['24/7 AI sales chat on any website', 'Answers from your live inventory', 'Captures leads into MarketSync CRM', 'One script tag — no site rebuild'] };

    const errBox = () => document.getElementById('error-box');
    function showErr(msg) { const e = errBox(); e.textContent = msg; e.classList.remove('hidden'); }

    function card({ key, label, price, tagline, features, popular, accent, trialDays }) {
      const border = popular ? 'border-indigo-600' : 'border-slate-200 dark:border-slate-800';
      const btnCls = accent === 'emerald'
        ? 'bg-emerald-600 hover:bg-emerald-500 text-white'
        : popular ? 'bg-indigo-600 hover:bg-indigo-500 text-white'
        : 'bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white';
      const labelCls = accent === 'emerald' ? 'text-emerald-600 dark:text-emerald-400' : popular ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500 dark:text-slate-400';
      return `<div class="bg-white dark:bg-slate-900 border ${border} rounded-lg p-7 flex flex-col relative">
        ${popular ? '<span class="absolute -top-3 right-6 bg-indigo-500 text-white text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full">Most popular</span>' : ''}
        <div class="text-xs font-bold uppercase tracking-wider ${labelCls} mb-2">${label}</div>
        <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-1">${price} <span class="text-sm font-medium text-slate-500">/ month</span></h3>
        <p class="text-xs text-slate-500 mb-6">${tagline}</p>
        <ul class="space-y-2 text-sm text-slate-600 dark:text-slate-300 mb-8 flex-1">
          ${features.map(f => `<li class="flex items-start gap-2"><span class="text-emerald-600 dark:text-emerald-400">✓</span> ${f}</li>`).join('')}
        </ul>
        <button data-plan="${key}" class="w-full ${btnCls} font-bold py-3 rounded transition">Start ${trialDays}-day free trial</button>
      </div>`;
    }

    async function renderPlans() {
      const grid = document.getElementById('plan-grid');
      let packages = [], currency = 'USD', symbol = '$';
      try {
        const r = await fetch(`${API}/billing/packages`);
        const d = await r.json();
        packages = d.packages || []; currency = d.currency || 'USD'; symbol = d.symbol || '$';
      } catch {}
      // Order Starter → Growth → Pro; fall back to fixed prices if the API has none.
      const order = ['starter', 'growth', 'pro'];
      const byKey = Object.fromEntries(packages.map(p => [p.key, p]));
      const pkgCards = order.filter(k => byKey[k] || PKG_META[k]).map(k => {
        const p = byKey[k] || {}; const meta = PKG_META[k] || { features: [], tagline: '' };
        const amt = p.amount != null ? p.amount : ({ starter: 999, growth: 1499, pro: 1999 })[k];
        return card({ key: k, label: (p.label || k), price: `${p.symbol || symbol}${amt}`, tagline: meta.tagline, features: meta.features, popular: !!meta.popular, trialDays: 30 });
      });
      const chatCard = card({ key: CHATBOT.key, label: CHATBOT.label, price: `${symbol}${CHATBOT.amount}`, tagline: CHATBOT.tagline, features: CHATBOT.features, accent: 'emerald', trialDays: 7 });
      grid.innerHTML = pkgCards.join('') + chatCard;
      grid.querySelectorAll('button[data-plan]').forEach(b => b.addEventListener('click', () => startCheckout(b.dataset.plan, b)));
    }

    async function startCheckout(plan, btn) {
      errBox().classList.add('hidden');
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Connecting to billing...';
      const token = localStorage.getItem('token');
      if (!token) { window.location.href = `register.html?plan=${plan}`; return; }
      const isChatbot = plan === 'ai_chatbot';
      const url = isChatbot ? `${API}/billing/subscribe-ai-chatbot` : `${API}/billing/subscribe-package`;
      const body = isChatbot ? {} : { package: plan };
      try {
        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }, body: JSON.stringify(body) });
        const data = await res.json();
        if (data.url) { window.location.href = data.url; return; }
        throw new Error(data.error || 'Could not start checkout');
      } catch (err) {
        showErr(err.message); btn.disabled = false; btn.textContent = original;
      }
    }

    renderPlans();
  </script>

    <script>
      (function(){
        var API='https://vehicle-marketplace-s0e4.onrender.com';
        var root=document.getElementById('msc-root'),fab=document.getElementById('msc-fab'),panel=document.getElementById('msc-panel'),
            msgs=document.getElementById('msc-msgs'),form=document.getElementById('msc-form'),input=document.getElementById('msc-input'),
            lead=document.getElementById('msc-lead'),chips=document.getElementById('msc-chips'),closeBtn=document.getElementById('msc-close');
        var history=[],greeted=false,lastUser='';
        function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
        function bubble(text,who){var b=document.createElement('div');b.className='msc-b '+(who==='user'?'msc-u':'msc-a');b.innerHTML=esc(text);msgs.appendChild(b);msgs.scrollTop=msgs.scrollHeight;return b;}
        function typing(){var b=document.createElement('div');b.className='msc-typing';b.textContent='MarketSync is typing…';msgs.appendChild(b);msgs.scrollTop=msgs.scrollHeight;return b;}
        function openPanel(){panel.hidden=false;fab.setAttribute('aria-expanded','true');if(!greeted){greeted=true;bubble("Hi! I'm the MarketSync assistant. Ask me anything about the platform — features, pricing, or how the workflow fits your store. I can also set up a demo.","bot");}setTimeout(function(){input.focus();},50);}
        function closePanel(){panel.hidden=true;fab.setAttribute('aria-expanded','false');}
        fab.addEventListener('click',function(){panel.hidden?openPanel():closePanel();});
        closeBtn.addEventListener('click',closePanel);
        async function send(text){
          text=(text||'').trim();if(!text)return;
          bubble(text,'user');lastUser=text;history.push({role:'user',content:text});
          input.value='';chips.style.display='none';
          var t=typing();
          try{
            var r=await fetch(API+'/marketsync/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
            var j=await r.json();t.remove();
            var reply=(j&&j.reply)||"Sorry, I couldn't respond just now.";
            bubble(reply,'bot');history.push({role:'assistant',content:reply});
            if(j&&j.capture){lead.hidden=false;lead.scrollIntoView({behavior:'smooth',block:'nearest'});}
          }catch(e){t.remove();bubble("I'm having trouble connecting. Leave your details and we'll reach out.","bot");lead.hidden=false;}
        }
        form.addEventListener('submit',function(e){e.preventDefault();send(input.value);});
        chips.addEventListener('click',function(e){var c=e.target.closest('.msc-chip');if(c)send(c.textContent);});
        lead.addEventListener('submit',async function(e){
          e.preventDefault();
          var fd=new FormData(lead);
          var payload={name:fd.get('name'),email:fd.get('email'),company:fd.get('company'),demo:lead.querySelector('[name=demo]').checked,message:lastUser};
          var btn=lead.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Sending…';
          try{
            var r=await fetch(API+'/marketsync/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
            if(!r.ok)throw 0;
            lead.hidden=true;bubble("Thanks, "+(payload.name.split(' ')[0]||'there')+"! The MarketSync team will be in touch shortly. Anything else I can answer?","bot");
          }catch(e){btn.disabled=false;btn.textContent='Send to MarketSync';bubble("Hmm, that didn't go through — you can also email hello@marketsync.link.","bot");}
        });
      })();
    </script>
