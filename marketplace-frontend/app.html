<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarketSync — Loading your dashboard…</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0b1220; color: #e2e8f0;
    }
    @media (prefers-color-scheme: light) { body { background: #f8fafc; color: #0f172a; } }
    .box { text-align: center; max-width: 22rem; padding: 2rem; }
    .spinner {
      width: 42px; height: 42px; margin: 0 auto 1.25rem;
      border: 3px solid rgba(99,102,241,.25); border-top-color: #6366f1;
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1rem; font-weight: 600; margin: 0 0 .35rem; }
    p { font-size: .85rem; opacity: .7; margin: 0; }
    .actions { margin-top: 1.25rem; display: none; }
    .btn {
      display: inline-block; background: #6366f1; color: #fff; text-decoration: none;
      font-weight: 600; font-size: .85rem; padding: .6rem 1.1rem; border-radius: .5rem;
      border: none; cursor: pointer;
    }
    .btn.secondary { background: transparent; color: #6366f1; }
  </style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Signing you in…</h1>
    <p id="subtitle">One moment while we load your dashboard.</p>
    <div class="actions" id="actions">
      <button class="btn" id="retry-btn" type="button">Try again</button>
      <a class="btn secondary" id="login-link" href="login.html">Back to sign in</a>
    </div>
  </div>

  <!-- The single shared auth module — same on every page. -->
  <script src="auth.js?v=20260803b"></script>
  <script>
    (function () {
      var titleEl = document.getElementById('title');
      var subEl = document.getElementById('subtitle');
      var spinner = document.getElementById('spinner');
      var actions = document.getElementById('actions');

      function fail(msg) {
        spinner.style.display = 'none';
        titleEl.textContent = 'Something went wrong';
        subEl.textContent = msg || 'We could not load your dashboard.';
        actions.style.display = 'block';
      }
      function toLogin() { window.location.replace('login.html'); }
      function toDashboard() { window.location.replace(window.MSAuth.resolveDashboardTarget()); }

      document.getElementById('retry-btn').addEventListener('click', function () {
        window.location.reload();
      });

      if (!window.MSAuth) { fail('Authentication module failed to load.'); return; }

      // 1. Ensure we have a valid (refreshed if needed) session.
      window.MSAuth.ensureFreshToken().then(function () {
        if (!window.MSAuth.isAuthenticated()) { toLogin(); return; }

        // 2. Confirm the session is real + has an entitlement, via the server. This is
        //    also the last line of defense against a locally-valid-but-server-revoked
        //    token. apiFetch refreshes/clears on 401 automatically.
        window.MSAuth.apiFetch('/access/context').then(function (r) {
          if (!r.ok) { fail('We could not confirm your account access.'); return; }
          return r.json().then(function (ctx) {
            // No products entitled yet (e.g. mid-checkout) — still send them to the
            // dashboard, which shows the correct empty/paywall state. Never blank.
            toDashboard();
          });
        }).catch(function (e) {
          // apiFetch throws 'Session expired' after a failed refresh → it already
          // redirected to login. Anything else is a transient error → offer retry.
          if (e && /Session expired/.test(e.message)) return;
          fail('Network error while loading your dashboard.');
        });
      }).catch(function () {
        if (window.MSAuth.isAuthenticated()) { toDashboard(); } else { toLogin(); }
      });
    })();
  </script>
</body>
</html>
