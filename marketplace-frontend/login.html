  <meta charset="UTF-8">
  <!-- Tailwind here uses darkMode:'class' (below), which needs *something* to actually add
       the .dark class — nothing did, so every dark: text/bg utility on this page silently
       never applied and dark-mode devices fell back to their own forced-dark heuristics,
       repainting the page inconsistently (dark background, unrepainted dark text). Set the
       class from the OS preference as early as possible, before Tailwind's CDN script scans
       the DOM, so first paint is correct and matches how assets/public-shell.js already
       themes every public marketing page. -->
  <script>(function(){var m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');function apply(){document.documentElement.classList.toggle('dark',!!(m&&m.matches));}apply();if(m){if(m.addEventListener)m.addEventListener('change',apply);else if(m.addListener)m.addListener(apply);}})();</script>

  <title>Log In to MarketSync</title>
  <meta name="description" content="Log in to your MarketSync dashboard to sync inventory, post vehicles to Facebook Marketplace, track sold cars, and see your team's sales leaderboard.">
  <link rel="canonical" href="https://marketsync.link/login.html">
  <style id="word-break-mobile-css">@media (max-width: 640px) { body { word-wrap: break-word; overflow-wrap: anywhere; } code { white-space: pre-wrap; word-break: break-all; } }</style>

<body class="bg-[#F7F8FA] dark:bg-[#121318] text-[#17191F] dark:text-[#F7F8FA] min-h-screen flex items-center justify-center font-sans overflow-x-hidden p-4">
  <div class="bg-white dark:bg-[#1A1D24] p-8 rounded-2xl border border-[#D9DEE8] dark:border-[#2B303A] shadow-2xl w-full max-w-md">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center justify-center mb-3">
        <img src="/Logo 2.0.png" alt="MarketSync DealerOS" class="h-14 w-auto dark:hidden">
        <img src="/Logo 2.1.png" alt="MarketSync DealerOS" class="h-14 w-auto hidden dark:block">
      </a>
      <h1 class="text-xl font-black text-[#17191F] dark:text-[#F7F8FA]">Log in to DealerOS</h1>
      <p class="text-xs font-semibold text-[#6B7280] dark:text-[#A5ACB8] mt-1">One dealership. One system.</p>
    </div>

    <div id="error-box" class="hidden mb-4 p-3 bg-red-100 dark:bg-red-900/50 border border-red-300 dark:border-red-700 text-red-700 dark:text-red-200 text-xs rounded"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400 mb-1">Professional Email</label>
        <input type="email" id="email" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-3.5 py-3 text-base text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">Password</label>
          <a href="forgot-password.html" class="text-xs text-indigo-600 dark:text-indigo-400 hover:underline">Forgot?</a>
        </div>
        <div class="relative w-full">
          <input type="password" id="password" required class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-3.5 py-3 text-base text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
        </div>
      </div>
      <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-300 select-none cursor-pointer">
        <input type="checkbox" id="remember-me" checked class="rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500">
        Keep me signed in for 30 days
      </label>
      <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded text-sm shadow transition">Sign In</button>

      <div class="relative my-3">
        <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-200 dark:border-slate-700"></span></div>
        <span class="relative flex justify-center text-[10px] uppercase tracking-wider text-slate-400 bg-white dark:bg-slate-900 px-2">or</span>
      </div>

      <button type="button" id="passkey-btn" class="w-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-900 dark:text-white font-semibold py-2.5 rounded text-sm border border-slate-300 dark:border-slate-700 transition flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
        Use fingerprint or face
      </button>
    </form>

    <form id="mfa-form" class="hidden space-y-4">
      <div class="mb-2 text-center">
        <div class="text-3xl mb-2">🔐</div>
        <h2 class="text-base font-bold text-slate-900 dark:text-white">Enter your code</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">
          Open your authenticator app (Google Authenticator, Authy, 1Password…) and type the 6-digit code below.
        </p>
      </div>
      <input type="text" id="mfa-code" inputmode="text" autocomplete="one-time-code" placeholder="123456 or XXXX-XXXX"
        class="w-full bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded px-3 py-2 text-center text-xl tracking-widest font-mono text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
      <p class="text-[10px] text-center text-slate-500 dark:text-slate-400 -mt-2">
        Lost your phone? Enter one of your backup codes instead.
      </p>
      <label class="flex items-center justify-center gap-2 text-xs text-slate-600 dark:text-slate-400 -mt-1 select-none cursor-pointer">
        <input type="checkbox" id="mfa-remember-me" checked class="rounded border-slate-300 dark:border-slate-600 text-indigo-600 focus:ring-indigo-500">
        Trust this browser for 30 days
      </label>
      <button type="submit" id="mfa-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded text-sm shadow transition">Verify &amp; Sign In</button>
    </form>

    <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-6">New location? <a href="register.html" class="text-indigo-600 dark:text-indigo-400 hover:underline">Register Dealership</a></p>
  </div>

  <script>
    const API = 'https://vehicle-marketplace-s0e4.onrender.com';
    let mfaState = null;  // { factor_id, partial_token } when MFA challenge is pending

    // Auto-bypass login and passkey prompt for 30 days on trusted computers
    (function autoBypassIfRemembered() {
      try {
        const token = localStorage.getItem('token');
        const until = Number(localStorage.getItem('ms_remember_until') || '0');
        const loggedOut = sessionStorage.getItem('ms_logged_out');
        if (token && until && Date.now() <= until && !loggedOut) {
          window.location.replace('dashboard.html');
        }
      } catch (e) {}
    })();

    // Persist the session. "Keep me signed in" stores a refresh token + a 30-day
    // window the dashboard uses to silently refresh the access token; unchecked
    // falls back to a 12-hour window.
    function storeSession(data) {
      try { sessionStorage.removeItem('ms_logged_out'); } catch {}
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      if (data.refresh_token) localStorage.setItem('refresh_token', data.refresh_token);
      if (data.trusted_device_token) localStorage.setItem('ms_trusted_device', data.trusted_device_token);
      // Persist login session for 30 days — no passkey or password re-entry required
      localStorage.setItem('ms_remember_until', String(Date.now() + 30 * 86400000));
    }

    async function fetchWithRetry(url, options, retries = 2) {
      for (let i = 0; i <= retries; i++) {
        try {
          return await fetch(url, options);
        } catch (err) {
          if (i === retries) throw new Error('Server connection taking a moment. Please click Sign In again in a few seconds.');
          await new Promise(r => setTimeout(r, 1500));
        }
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const errBox = document.getElementById('error-box');
      btn.disabled = true; btn.textContent = 'Verifying identity...';
      errBox.classList.add('hidden');

      const trustedDevice = localStorage.getItem('ms_trusted_device');

      try {
        const res = await fetchWithRetry(`${API}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(trustedDevice ? { 'x-trusted-device': trustedDevice } : {})
          },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            trusted_device: trustedDevice
          })
        });
        const data = await res.json();

        // 2FA challenge — backend returned 202 with mfa_required:true
        if (res.status === 202 && data.mfa_required) {
          mfaState = { factor_id: data.factor_id, partial_token: data.partial_token };
          document.getElementById('login-form').classList.add('hidden');
          document.getElementById('mfa-form').classList.remove('hidden');
          document.getElementById('mfa-code').focus();
          return;
        }

        if (!res.ok || data.error) throw new Error(data.error || 'Identity rejection');

        storeSession(data);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Sign In to Dashboard';
      }
    });

    document.getElementById('mfa-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('mfa-submit-btn');
      const errBox = document.getElementById('error-box');
      btn.disabled = true; btn.textContent = 'Checking…';
      errBox.classList.add('hidden');

      const rememberDevice = document.getElementById('mfa-remember-me')?.checked || document.getElementById('remember-me')?.checked || false;

      try {
        const res = await fetch(`${API}/auth/2fa/challenge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            factor_id: mfaState.factor_id,
            partial_token: mfaState.partial_token,
            code: document.getElementById('mfa-code').value.trim(),
            remember_device: rememberDevice
          })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'That code did not work. Try again.');

        // Friendly heads-up when a backup code was used
        if (data.used_recovery_code) {
          alert(`✓ Backup code used. You have ${data.recovery_codes_remaining} backup code${data.recovery_codes_remaining === 1 ? '' : 's'} left.\n\nYou should make new backup codes from your dashboard's Security section soon.`);
        }

        storeSession(data);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Verify & Sign In';
      }
    });

    // Sign in with passkey — fingerprint, Face ID, Windows Hello, or hardware key
    document.getElementById('passkey-btn').addEventListener('click', async () => {
      const btn = document.getElementById('passkey-btn');
      const errBox = document.getElementById('error-box');
      const email = document.getElementById('email').value.trim();
      errBox.classList.add('hidden');

      if (!email) {
        errBox.textContent = 'Please type your email above first.';
        errBox.classList.remove('hidden');
        return;
      }
      if (!window.SimpleWebAuthnBrowser) {
        errBox.textContent = 'Passkeys are not loaded yet. Refresh the page and try again.';
        errBox.classList.remove('hidden');
        return;
      }

      const original = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = 'Waiting for your device…';

      try {
        const beginRes = await fetch(`${API}/auth/passkey/login/begin`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const options = await beginRes.json();
        if (!beginRes.ok) throw new Error(options.error || 'Could not start passkey sign-in.');

        // Browser prompts user: Touch ID / Face ID / passkey picker
        const assertion = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: options });

        const finishRes = await fetch(`${API}/auth/passkey/login/finish`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, response: assertion })
        });
        const data = await finishRes.json();
        if (!finishRes.ok) throw new Error(data.error || 'Passkey sign-in failed.');

        storeSession(data);
        window.location.href = 'dashboard.html';
      } catch (err) {
        // User cancelling the browser prompt throws an AbortError — handle nicely
        const msg = err.name === 'NotAllowedError' || err.name === 'AbortError'
          ? 'Sign-in cancelled.'
          : (err.message || 'Passkey sign-in failed.');
        errBox.textContent = msg;
        errBox.classList.remove('hidden');
      } finally {
        btn.disabled = false; btn.innerHTML = original;
      }
    });

    // Prefill the email when arriving from the extension's "Sign in with a passkey"
    // button (which passes ?email=…), and nudge focus to the passkey button so the
    // user can authenticate in one tap.
    (function prefillFromQuery() {
      try {
        const qp = new URLSearchParams(location.search).get('email');
        if (qp) {
          const el = document.getElementById('email');
          if (el && !el.value) el.value = qp;
          document.getElementById('passkey-btn')?.focus();
        }
      } catch {}
    })();
  </script>
</body>
