name: CI — audit & sanity

# Guards the codebase on every push / PR to main:
#  • fails the build if a HIGH or CRITICAL dependency advisory appears
#    (this is what would have caught the ws DoS before it hit the default branch)
#  • sanity-checks that every backend source file parses
# Kept intentionally fast and dependency-light so it never blocks a hotfix.
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketplace-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: marketplace-backend/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Audit — fail on high/critical
        run: npm audit --audit-level=high --omit=dev
      - name: Syntax-check all backend sources
        run: npm run check:syntax
      - name: Validate ESM module import resolution
        run: npm run check:imports
      - name: Validate named export bindings
        run: npm run check:exports
      - name: Validate Express route registration
        run: npm run check:routes
      - name: Validate frontend scripts & top-level identifiers
        run: npm run check:frontend
      - name: Validate server startup (dry-run mode)
        run: npm run check:startup
      # Full behavioral/security test suite. This is the real release gate: a commit
      # can parse, import and start cleanly while still failing business/security tests.
      # Make this a REQUIRED status check in branch protection for `main` (and `staging`)
      # once the suite is green.
      - name: Run test suite
        run: npm test
